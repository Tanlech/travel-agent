services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 容器内通过服务名连 redis/qdrant；本地开发（python main.py）则用 .env 里的 localhost:6379 / localhost:6333
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - travel-agent-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - travel_agent_redis_data:/data
    networks:
      - travel-agent-net
  #http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - travel-agent-net

volumes:
  travel_agent_redis_data:
  qdrant_storage:

networks:
  travel-agent-net:
    driver: bridge
