services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 容器内通过服务名连 redis；本地开发（python main.py）则用 .env 里的 localhost:6379
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - travel-agent-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - travel_agent_redis_data:/data
    networks:
      - travel-agent-net

volumes:
  travel_agent_redis_data:

networks:
  travel-agent-net:
    driver: bridge
