[project]
name = "travel-agent"
version = "0.1.0"
description = "Graph-based travel planning agent system foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "qdrant-client>=1.9.0",
  "fastembed>=0.3.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "integration: tests that call real external services",
]
