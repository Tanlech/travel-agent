<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Agent · 旅行规划助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  header .sid { font-size: 12px; opacity: 0.85; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.35); }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto;
  }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.assistant { align-items: flex-start; }
  .bubble {
    max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .msg.user .bubble { background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; }
  .mode-tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    margin-bottom: 4px; font-weight: 600;
  }
  .mode-clarify { background: #e3f2fd; color: #1565c0; }
  .mode-planning { background: #e8f5e9; color: #2e7d32; }
  .mode-revise { background: #fff3e0; color: #e65100; }
  .mode-qa { background: #f3e5f5; color: #7b1fa2; }
  .mode-error { background: #ffebee; color: #c62828; }
  .plan-card {
    background: #fff; border-radius: 10px; padding: 14px; margin-top: 8px; max-width: 75%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 4px solid #667eea;
  }
  .plan-card h3 { font-size: 15px; color: #333; margin-bottom: 8px; }
  .plan-summary { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 10px; }
  .day-item {
    background: #f8f9fa; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
  }
  .day-item .day-label { font-weight: 600; color: #667eea; margin-right: 6px; }
  .blocks { margin-top: 6px; }
  .block { font-size: 12px; color: #444; padding: 3px 0; line-height: 1.5; }
  .b-time { color: #667eea; font-weight: 600; margin-right: 4px; font-size: 11px; }
  .b-title { color: #333; }
  .b-detail { color: #888; font-size: 11px; padding-left: 22px; margin-top: 1px; }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .meta-chip {
    font-size: 11px; background: #eef; color: #448; padding: 3px 8px; border-radius: 8px;
  }
  .loading { display: none; align-items: center; gap: 6px; color: #888; font-size: 13px; padding: 8px 0; }
  .loading.show { display: flex; }
  .dot { width: 8px; height: 8px; background: #667eea; border-radius: 50%; animation: bounce 1.4s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
  footer {
    background: #fff; padding: 14px 20px; border-top: 1px solid #e0e0e0;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .input-row { display: flex; gap: 10px; }
  #input {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
    outline: none; transition: border 0.2s;
  }
  #input:focus { border-color: #667eea; }
  #send {
    background: #667eea; color: #fff; border: none; padding: 10px 24px; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;
  }
  #send:hover { background: #5568d3; }
  #send:disabled { background: #aaa; cursor: not-allowed; }
  .hint { font-size: 12px; color: #999; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>✈️ Travel Agent</h1>
  <span class="sid" id="sidDisplay">无会话</span>
  <button class="btn" onclick="loadHistory()">加载历史</button>
  <button class="btn" onclick="newSession()">新对话</button>
</header>
<div id="messages">
  <div class="msg assistant">
    <span class="mode-tag mode-qa">qa</span>
    <div class="bubble">你好！我是旅行规划助手。告诉我你想去哪玩、什么时候出发，我来帮你规划行程。</div>
  </div>
</div>
<div class="loading" id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>正在思考...</span></div>
<footer>
  <div class="input-row">
    <input id="input" type="text" placeholder="例如：我想去北京玩，8月10号到12号，两个人" autocomplete="off">
    <button id="send" onclick="send()">发送</button>
  </div>
  <div class="hint">提示：规划可能需要 1-2 分钟（调用高德地图 + 大模型）。多轮对话会自动累计信息。</div>
</footer>

<script>
let sessionId = localStorage.getItem('ta_session_id') || null;
if (sessionId) document.getElementById('sidDisplay').textContent = sessionId.slice(0, 12) + '...';

const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  sendBtn.disabled = true;
  addMessage('user', msg);
  document.getElementById('loading').classList.add('show');
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: msg })
    });
    const data = await res.json();
    if (data.session_id) {
      sessionId = data.session_id;
      localStorage.setItem('ta_session_id', sessionId);
      document.getElementById('sidDisplay').textContent = sessionId.slice(0, 12) + '...';
    }
    const text = data.summary || data.follow_up_question || '(无回复)';
    addMessage('assistant', text, data.mode, data.plan);
  } catch (e) {
    addMessage('assistant', '请求失败：' + e.message, 'error');
  } finally {
    document.getElementById('loading').classList.remove('show');
    sendBtn.disabled = false;
    input.focus();
  }
}

function addMessage(role, text, mode, plan) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (mode) {
    const tag = document.createElement('span');
    tag.className = 'mode-tag mode-' + (mode || 'qa');
    tag.textContent = mode;
    wrap.appendChild(tag);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (plan) wrap.appendChild(renderPlan(plan));
  document.getElementById('messages').appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

function renderPlan(plan) {
  const card = document.createElement('div');
  card.className = 'plan-card';
  card.innerHTML = '<h3>🗺️ ' + (plan.destination || '') + ' 行程方案</h3>';
  if (plan.summary) {
    const s = document.createElement('div');
    s.className = 'plan-summary';
    s.textContent = plan.summary;
    card.appendChild(s);
  }
  const days = plan.daily_plan || plan.day_plans || [];
  if (Array.isArray(days) && days.length) {
    days.forEach((day, i) => {
      const idx = day.day_index ?? day.day ?? day.day_number ?? (i + 1);
      const area = day.primary_area || day.area || day.theme || '';
      // 兼容两套结构：plan.daily_plan 的 day 用 items，draft.day_plans 的 day 用 time_blocks
      const blocks = day.time_blocks || day.blocks || day.items || [];
      const dayItem = document.createElement('div');
      dayItem.className = 'day-item';
      let html = '<div><span class="day-label">Day ' + idx + '</span>' +
        (area ? ' · <span style="color:#555">' + area + '</span>' : '') + '</div>';
      if (Array.isArray(blocks) && blocks.length) {
        html += '<div class="blocks">';
        blocks.forEach(b => {
          const time = (b.start_time || '') + (b.end_time ? '-' + b.end_time : '');
          const typeIcon = {'attraction':'🏛️','transport':'🚗','meal':'🍽️','return':'🏠','flex':'✨'}[b.item_type] || '•';
          html += '<div class="block"><span class="b-time">' + time + '</span>' +
            '<span class="b-icon">' + typeIcon + '</span> ' +
            '<span class="b-title">' + (b.title || '') + '</span>' +
            (b.detail ? '<div class="b-detail">' + b.detail + '</div>' : '') + '</div>';
        });
        html += '</div>';
      }
      dayItem.innerHTML = html;
      card.appendChild(dayItem);
    });
  }
  const meta = document.createElement('div');
  meta.className = 'meta-row';
  if (plan.stay_recommendation && plan.stay_recommendation.length) {
    const stay = plan.stay_recommendation[0];
    const stayText = typeof stay === 'string' ? stay : (stay.name || stay.hotel_name || '住宿已推荐');
    meta.innerHTML += '<span class="meta-chip">🏨 ' + String(stayText).slice(0, 30) + '</span>';
  }
  if (plan.transport_plan && plan.transport_plan.length) {
    meta.innerHTML += '<span class="meta-chip">🚗 交通已规划</span>';
  }
  if (plan.weather_notes && plan.weather_notes.length) {
    const w = plan.weather_notes[0];
    meta.innerHTML += '<span class="meta-chip">🌤️ ' + (typeof w === 'string' ? w.slice(0, 30) : '天气已评估') + '</span>';
  }
  if (meta.innerHTML) card.appendChild(meta);
  return card;
}

async function loadHistory() {
  if (!sessionId) { alert('当前无会话，先发一条消息吧'); return; }
  try {
    const res = await fetch('/session/' + sessionId);
    const data = await res.json();
    if (data.status !== 'ok') { alert('未找到会话历史'); return; }
    const box = document.getElementById('messages');
    box.innerHTML = '';
    if (Array.isArray(data.recent_messages)) {
      data.recent_messages.forEach(m => addMessage(m.role, m.content));
    }
    const info = document.createElement('div');
    info.className = 'msg assistant';
    info.innerHTML = '<div class="bubble" style="background:#fff8e1">📂 已恢复会话：阶段=' +
      data.stage + '，改稿次数=' + data.revision_count + '，已有行程=' + (data.has_plan ? '是' : '否') + '</div>';
    box.appendChild(info);
    window.scrollTo(0, document.body.scrollHeight);
  } catch (e) {
    alert('加载失败：' + e.message);
  }
}

function newSession() {
  sessionId = null;
  localStorage.removeItem('ta_session_id');
  document.getElementById('sidDisplay').textContent = '无会话';
  document.getElementById('messages').innerHTML = '';
  addMessage('assistant', '已开始新对话。告诉我你想去哪玩？', 'qa');
}
</script>
</body>
</html>
